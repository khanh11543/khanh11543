<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone Sales Management</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* CSS chuyên nghiệp tích hợp cho demo */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      background-color: #f4f4f4;
      color: #333;
    }

    header {
      background-color: #0d6efd;
      color: white;
      padding: 20px 0;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: auto;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav ul {
      list-style: none;
      display: flex;
    }

    nav ul li {
      margin-left: 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .hero {
      background: url('images/phones/banner.jpg') no-repeat center center/cover;
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }

    .hero h1 {
      font-size: 48px;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 20px;
    }

    .products {
      padding: 40px 0;
      background-color: white;
    }

    .products h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
    }

    .product-card {
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .product-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .product-card .info {
      padding: 15px;
    }

    .product-card .info h3 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .product-card .info p {
      font-size: 16px;
      color: #0d6efd;
      font-weight: bold;
    }

    footer {
      background-color: #0d6efd;
      color: white;
      text-align: center;
      padding: 20px 0;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <nav>
        <h2>📱 PhoneStore</h2>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="register.html">Register</a></li>
          <li><a href="profile.html">Profile</a></li>
          <li><a href="cart.html">My Cart</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="hero">
    <h1>Discover the Best Phones at the Best Prices</h1>
  </section>

  <section class="products">
    <div class="container">
      <h2>🔥 Featured Phones</h2>
      <div class="product-grid">
        <div class="product-card">
          <img src="14promax.png" alt="Phone 1">
          <div class="info">
            <h3>iPhone 14 Pro Max</h3>
            <p>$1,199</p>
          </div>
        </div>

        <div class="product-card">
          <img src="ss S23.png" alt="Phone 2">
          <div class="info">
            <h3>Samsung Galaxy S23</h3>
            <p>$999</p>
          </div>
        </div>

        <div class="product-card">
          <img src="google p.png" alt="Phone 3">
          <div class="info">
            <h3>Google Pixel 8</h3>
            <p>$799</p>
          </div>
        </div>

        <div class="product-card">
          <img src="xaomi.png" alt="Phone 4">
          <div class="info">
            <h3>Xiaomi 13 Pro</h3>
            <p>$749</p>
          </div>
        </div>
      </div>
    </div>
  </section>


  
  <footer>
    <p>&copy; 2025 PhoneStore. All rights reserved.</p>
  </footer>

</body>
</html>

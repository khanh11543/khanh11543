<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us - PhoneStore</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #0d6efd;
      color: white;
      padding: 20px 0;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: auto;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    nav a:hover {
      text-decoration: underline;
    }

    h2 {
      text-align: center;
      margin-top: 40px;
      color: #0d6efd;
    }

    form {
      background-color: white;
      padding: 30px;
      margin: 40px auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background-color: #0d6efd;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #094ec0;
    }

    footer {
      background-color: #0d6efd;
      color: white;
      text-align: center;
      padding: 20px 0;
    }
  </style>
  <script>
    function validateContactForm() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();

      if (name === '' || email === '' || message === '') {
        alert("Please fill in all fields.");
        return false;
      }

      if (!email.includes('@') || !email.includes('.')) {
        alert("Please enter a valid email address.");
        return false;
      }

      alert("Thank you for contacting us!");
      return true;
    }
  </script>
</head>
<body>

  <header>
    <div class="container">
      <nav>
        <h2>📱 PhoneStore</h2>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="register.html">Register</a></li>
          <li><a href="profile.html">Profile</a></li>
          <li><a href="cart.html">My Cart</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h2>Contact Us</h2>
    <form onsubmit="return validateContactForm()">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name">

      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email">

      <label for="message">Your Message</label>
      <textarea id="message" name="message" rows="6" placeholder="Write your message here..."></textarea>

      <button type="submit">Send Message</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 PhoneStore. All rights reserved.</p>
  </footer>

</body>
</html>
